# UavSchedulerSim —— 工程化元数据与工具链配置
#
# 本文件让项目从「一堆脚本」升级为「可安装、可测试、可静态检查的 Python 包」：
#   pip install -e ".[dev,gpu]"    # 开发环境（含 pytest / ruff / numba-cuda 相关）
#   uavsim check                   # 安装后可直接用控制台入口，无需写 run.py
#   pytest                         # 一条命令收集 tests/ 下全部用例
#   ruff check src tests           # 静态检查
#
# 设计取舍：运行期核心逻辑只用标准库（threading/queue/time），
# 可视化与持久化拆成可选 extra，保证「无网/无数据库也能跑通」这一教学前提。

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sched-sim"
version = "1.1.0"
description = "面向智慧地质勘查的无人机集群并发自适应负载均衡调度仿真系统（《操作系统》课程实训）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["operating-system", "scheduling", "mlfq", "dynamic-priority", "uav", "simulation", "discrete-event"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: System :: Operating System Kernels",
]

# 运行期「必需」依赖：越少越好，核心仿真只用标准库。
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7,<4.0", "pandas>=2.0"]
db = ["PyMySQL>=1.1.0"]
# 桌面窗口（app.py / 启动仿真软件.bat）。缺失时自动降级为浏览器打开，不影响核心仿真。
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pandas>=2.0",
    "matplotlib>=3.7,<4.0",
    "PyMySQL>=1.1.0",
]
# GPU 加速实验（可选）：主路径是 gpu/replication_kernel.cu —— 用 nvcc 直接编译，
# 不依赖任何 Python 包；没有 CUDA 环境时会自动回退到 gpu/des_model.py（纯 Python + 多进程）。
# 这里刻意不声明 numba-cuda：评估过但未采用（模型需要大量可变状态，numba CUDA target
# 支持很差，硬写会得到第四份难以验证的实现）。详见 gpu/README.md 第 3 节。
gpu = []

[project.scripts]
uavsim = "uav_sim.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
uav_sim = ["static/*", "static/**/*"]

# --------------------------------------------------------------------------
# 工具链
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: 端到端 / 需要真跑仿真的用例",
    "db: 需要本机 MySQL 的用例（连不上会自动跳过）",
    "gpu: 需要 CUDA 设备的用例（无显卡会自动跳过）",
]

[tool.coverage.run]
source = ["src/uav_sim"]
branch = true
omit = ["src/uav_sim/static/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 110
target-version = "py311"
# tests/fixtures 是"改动前实现"的历史快照，必须与当时逐字一致（回归对拍用），
# 因此不参与 lint 与格式化。
extend-exclude = [".venv", "build", "dist", "archive", "shots", "tests/fixtures"]

[tool.ruff.lint]
# 规则集刻意保守：本项目是"教学代码"，每个模块都靠 sys.path 自举导入（E402 必现），
# 且全项目统一使用 typing.Dict/List/Optional 写法（不启用 UP，避免与既有风格冲突）。
# 目标是"能当门禁用"——`ruff check src tests run.py` 应零告警，而不是刷出几百条风格意见。
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # 长行交给 formatter；中文注释按字符宽度排版
    "E402",   # sys.path 自举后再 import 是本项目刻意的可移植性写法
    "B008",   # 允许函数默认值里调用（如 argparse/typing 场景）
    "B905",   # zip(strict=) 需要 3.10+，教学代码保持与示例一致更易读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]        # 测试断言直接用 assert
"src/uav_sim/__init__.py" = ["F401"]   # 包聚合导出
"src/uav_sim/scheduler/__init__.py" = ["F401"]  # 调度器注册表再导出
