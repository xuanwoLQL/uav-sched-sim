<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据流详细逻辑图 · 无人机采集到入库</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-paper2: #ececec;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-soft:   #5a6580;
    --color-accent: #bf4520;
    --font-sans:  'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Noto Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1120px; width: 100%; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 0.35rem;
  }
  .dek { font-size: 0.82rem; color: var(--color-soft); margin-bottom: 1.5rem; max-width: 66ch; }
  svg { width: 100%; min-width: 1040px; display: block; }
  @media print {
    .diagram-container { overflow-x: visible; }
    svg { min-width: 0; }
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Data flow · 函数级链路</p>
  <h1>从无人机采集 → 调度执行 → 指标入库 → 三维呈现</h1>
  <p class="dek">九个环节，每个节点下方标注真正执行的函数（mono）。左侧按四层分区：
     无人机端 / 调度内核 / 评测入库 / 表现层。虚线是跨层的「旁路」路径（不走数据库）。</p>

  <div class="diagram-container">
    <svg viewBox="0 0 1040 1120" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="flow-title flow-desc">
      <title id="flow-title">无人机数据从采集到入库的函数级数据流</title>
      <desc id="flow-desc">按无人机端、调度内核、评测入库、表现层四个分区，展示任务从轨迹生成、入队、调度决策、派发执行、弱网重传、指标计算、数据库写入到三维界面呈现的九个环节及对应函数。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones（先画，位于底层） ===== -->
      <rect x="336" y="80" width="504" height="196" rx="8" fill="#ececec" opacity="0.55"/>

      <rect x="336" y="296" width="504" height="412" rx="8" fill="#ececec" opacity="0.55"/>

      <rect x="336" y="728" width="504" height="196" rx="8" fill="#ececec" opacity="0.55"/>

      <rect x="336" y="944" width="504" height="96" rx="8" fill="#ececec" opacity="0.55"/>


      <rect x="340" y="68" width="136" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="352" y="82" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">① 无人机端</text>
      <rect x="340" y="284" width="136" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="352" y="298" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">② 调度内核</text>
      <rect x="340" y="716" width="136" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="352" y="730" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">③ 评测与入库</text>
      <rect x="340" y="932" width="136" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="352" y="946" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">④ 表现层</text>

      <!-- ===== arrows + labels（先画，位于节点之下） ===== -->
      <line x1="560" y1="152" x2="560" y2="204" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="164" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLAY</text>
      <line x1="560" y1="260" x2="560" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="272" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="281" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
      <line x1="560" y1="368" x2="560" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="380" width="58" height="12" rx="2" fill="#f5f5f5"/>
      <text x="599" y="389" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>
      <line x1="560" y1="476" x2="560" y2="528" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="488" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="497" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>
      <line x1="560" y1="584" x2="560" y2="636" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="596" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="590" y="605" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLL</text>
      <line x1="560" y1="692" x2="560" y2="744" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="704" width="58" height="12" rx="2" fill="#f5f5f5"/>
      <text x="599" y="713" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>
      <line x1="560" y1="800" x2="560" y2="852" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="812" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="821" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT</text>
      <line x1="560" y1="908" x2="560" y2="960" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="570" y="920" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="929" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

      <!-- 重传：⑥ -> ④（绕右侧，虚线回到就绪队列） -->
      <path d="M812 664 H868 V448 H816" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="880" y="544" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="908" y="553" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

      <!-- 实时旁路：④ -> ⑨（不走数据库，直接读快照） -->
      <path d="M360 448 H320 V988 H356" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="272" y="700" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="709" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIVE</text>

      <!-- ===== nodes ===== -->
      <rect x="360" y="96" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="96" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">① 轨迹预生成（控制变量法的源头）</text>
      <text x="376" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">scenarios.generate_trace() → WorkloadTrace.events</text>

      <rect x="360" y="204" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="204" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">② 采集线程醒来（无人机行为 → 任务对象）</text>
      <text x="376" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">UAVWorker.run() → Simulator.make_task()</text>

      <rect x="360" y="312" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="312" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">③ 提交入队（按业务优先级分流）</text>
      <text x="376" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Simulator.submit_task() → MultiLevelQueue.enqueue()</text>

      <rect x="360" y="420" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="420" width="452" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
      <text x="376" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">④ 调度决策（权重 / 饥饿补偿 / 限流）</text>
      <text x="376" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">DynamicWeightScheduler.step() → _weight() → try_admit()</text>

      <rect x="360" y="528" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="528" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">⑤ 派发执行（8 线程真正"上传"）</text>
      <text x="376" y="570" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Simulator.dispatch() → _run_task()</text>

      <rect x="360" y="636" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="636" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="660" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">⑥ 弱网判定（失败 → 退避重传 / 本地缓存）</text>
      <text x="376" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">_failure_probability() → _on_upload_failed()</text>

      <rect x="360" y="744" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="744" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="768" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">⑦ 指标计算（24 项，口径统一）</text>
      <text x="376" y="786" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">compute_metrics() → RunResult</text>

      <rect x="360" y="852" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="852" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="876" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">⑧ 入库 MySQL 8（单事务 + 批量 executemany）</text>
      <text x="376" y="894" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">DBWriter.save_run() → 4 张明细表</text>

      <rect x="360" y="960" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="960" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="984" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Microsoft YaHei', sans-serif">⑨ 三维呈现（120ms 轮询实时快照）</text>
      <text x="376" y="1002" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">snapshot() → GET /api/state → applyState()</text>


      <!-- ===== legend ===== -->
      <line x1="40" y1="1064" x2="1000" y2="1064" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="1084" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">图例</text>
      <line x1="96" y1="1081" x2="132" y2="1081" stroke="#4f5d75" stroke-width="1"/>
      <text x="140" y="1084" fill="#5a6580" font-size="9" font-family="'Geist', 'Microsoft YaHei', sans-serif">任务 / 数据向前推进</text>
      <line x1="332" y1="1081" x2="368" y2="1081" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="376" y="1084" fill="#5a6580" font-size="9" font-family="'Geist', 'Microsoft YaHei', sans-serif">弱网重传回队列</text>
      <line x1="548" y1="1081" x2="584" y2="1081" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="592" y="1084" fill="#5a6580" font-size="9" font-family="'Geist', 'Microsoft YaHei', sans-serif">实时快照旁路（不入库）</text>
      <rect x="796" y="1074" width="14" height="14" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="818" y="1084" fill="#5a6580" font-size="9" font-family="'Geist', 'Microsoft YaHei', sans-serif">算法核心</text>
    </svg>
  </div>
</div>
</body>
</html>
